<!DOCTYPE html>
<html lang="en">
<head>
    <title>Registration Form</title>
</head>
<body>
    <h2>Registration Form</h2>
    <fieldset style="border: 2px solid blue">
        <legend>registration form</legend>
        <form action="#">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
        <br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>
        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone" required>
        <br><br>
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob">
        <br><br>
        <label>Gender:</label>
        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>
        <input type="radio" id="other" name="gender" value="Other">
        <label for="other">Other</label>
        <br><br>
        <label for="age">Age:</label>
        <input type="number" id="age" name="age" min="1">
        <br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <br><br>
        <label>Hobbies (Choose a Sport):</label>
        <br>
        <input type="radio" id="cricket" name="hobby" value="Cricket">
        <label for="cricket">Cricket</label>
        <br>
        <input type="radio" id="football" name="hobby" value="Football">
        <label for="football">Football</label>
        <br>
        <input type="radio" id="tennis" name="hobby" value="Tennis">
        <label for="tennis">Tennis</label>
        <br>
        <input type="radio" id="basketball" name="hobby" value="Basketball">
        <label for="basketball">Basketball</label>
        <br><br>
        <label for="rating">Rate Yourself (1-10):</label>
        <input type="range" id="rating" name="rating" min="1" max="10">
        <br><br>
        <label for="color">Favorite Color:</label>
        <input type="color" id="color" name="color">
        <br><br>
        <label for="profile">Upload Profile Picture:</label>
        <input type="file" name="profile" id="profile">
        <br><br>
        <label for="country">Select Country:</label>
        <select id="country" name="country">
            <option value="" disabled selected>Choose a country</option>
            <option value="india">India</option>
            <option value="usa">United States</option>
            <option value="uk">United Kingdom</option>
        </select>
        <br><br>
        <button type="submit">Register</button>
        <button type="reset">reset</button>
    </form>
    </fieldset>
</body>
</html>
